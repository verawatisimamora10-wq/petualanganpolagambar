<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Pola Gambar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DC;--card:#fff;--ink:#2A1418;--mute:#6b5558;--red:#8E1F2F;--gold:#E8A91C;--ok:#1E7B4F;--no:#C2410C;--line:#ead7b4;--sky:#2B7BB9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1114;--card:#2b1a1e;--ink:#f6e9dc;--mute:#c2a9a6;--red:#ee6a7e;--gold:#f0bd3a;--ok:#4fc58a;--no:#ff9a5c;--line:#4a3036;--sky:#6fb6ee}}
:root[data-theme="dark"]{--bg:#1d1114;--card:#2b1a1e;--ink:#f6e9dc;--mute:#c2a9a6;--red:#ee6a7e;--gold:#f0bd3a;--ok:#4fc58a;--no:#ff9a5c;--line:#4a3036;--sky:#6fb6ee}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:700;font-size:20px;min-height:100vh}
.band{height:16px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--ink) 24px 30px,var(--gold) 30px 36px,var(--ink) 36px 42px)}
main{max-width:960px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.05}
h1{font-size:clamp(38px,8vw,72px);font-weight:800;color:var(--red);text-align:center}
h2{font-size:30px}
.sub{color:var(--mute);text-align:center;font-size:clamp(20px,3.5vw,26px);margin:8px 0 18px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:20px}
button{font:inherit;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;cursor:pointer;border:0;border-radius:16px;padding:14px 26px;background:var(--red);color:#fff;font-size:26px}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:16px;padding:6px 12px}
.center{text-align:center;margin-top:18px}
.food{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.food svg{width:clamp(56px,12vw,92px);height:clamp(56px,12vw,92px);animation:bob 2.4s ease-in-out infinite}
.food svg:nth-child(2){animation-delay:.3s}.food svg:nth-child(3){animation-delay:.6s}.food svg:nth-child(4){animation-delay:.9s}.food svg:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.rules{list-style:none;counter-reset:r;padding:0;margin:0}
.rules li{counter-increment:r;display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line);font-size:22px}
.rules li::before{content:counter(r);flex:0 0 38px;height:38px;border-radius:50%;background:var(--gold);color:#2A1418;font-family:"Baloo 2";font-weight:800;display:grid;place-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-family:"Baloo 2";font-weight:800;font-size:24px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 18px}
.pill b{color:var(--red)}
.prog{display:flex;gap:6px;margin-bottom:12px}.prog i{flex:1;height:10px;border-radius:6px;background:var(--line)}.prog i.d{background:var(--ok)}.prog i.c{background:var(--gold)}
.q{font-size:clamp(24px,4.4vw,34px);line-height:1.3;margin:8px 0 14px;font-family:"Baloo 2";font-weight:800}
.rowt{font-family:"Baloo 2";font-size:24px;font-weight:800;color:var(--red);margin:6px 0 4px}
.seq{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.grp{border:3px dashed var(--line);border-radius:16px;padding:8px 12px;background:var(--bg)}
.grp small{display:block;color:var(--mute);font-size:16px;margin-bottom:4px}
.ic{display:flex;flex-wrap:wrap;gap:2px;max-width:250px}
.ic svg{width:30px;height:30px}
.qm{font-family:"Baloo 2";font-size:54px;font-weight:800;color:var(--red);line-height:1.1;padding:0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.opt{background:var(--card);color:var(--ink);border:4px solid var(--line);font-size:32px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:scale(1.03)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no);opacity:.7}
.opt:disabled{cursor:default}
.msg{margin-top:16px;padding:14px;border-radius:16px;font-family:"Baloo 2";font-size:clamp(24px,4.5vw,34px);font-weight:800;text-align:center;animation:pop .35s}
.msg.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.msg.no{background:color-mix(in srgb,var(--no) 16%,var(--card));color:var(--no)}
.msg.gold{background:color-mix(in srgb,var(--gold) 28%,var(--card));color:var(--ink)}
.msg.zonk{background:color-mix(in srgb,var(--sky) 18%,var(--card));color:var(--ink)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.why{margin-top:12px;padding:12px 16px;border-left:8px solid var(--gold);background:var(--bg);border-radius:10px;font-size:22px}
.stars{display:flex;justify-content:center;gap:10px;font-size:40px;margin-top:6px}
.stars span{animation:pop .5s backwards}.stars span:nth-child(2){animation-delay:.12s}.stars span:nth-child(3){animation-delay:.24s}
.gift{font-size:96px;background:var(--card);border:4px dashed var(--gold);padding:6px 30px;animation:bob 1.6s ease-in-out infinite}
.big{font-family:"Baloo 2";font-weight:800;font-size:clamp(64px,16vw,120px);color:var(--red);text-align:center;line-height:1}
.cf{position:fixed;top:-20px;width:12px;height:18px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.food svg,.gift,.msg,.stars span,.cf{animation:none}.cf{display:none}.opt:hover:not(:disabled){transform:none}}
.score{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.chip{flex:1 0 120px;border:3px solid var(--line);border-radius:16px;padding:6px 12px;background:var(--card);text-align:center;font-size:18px}
.chip b{display:block;font-family:"Baloo 2";font-size:34px;line-height:1;color:var(--red)}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 40%,transparent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;margin:14px 0 6px}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.rng{display:flex;align-items:center;gap:12px}.rng input{padding:0;flex:1}
.rank{list-style:none;padding:0;margin:14px 0}
.rank li{display:flex;justify-content:space-between;padding:12px 18px;border:3px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--card);font-size:26px;font-family:"Baloo 2";font-weight:800}
.rank li:first-child{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 24%,var(--card))}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.box{aspect-ratio:1;font-size:clamp(48px,12vw,90px);background:var(--card);border:4px dashed var(--gold);color:var(--ink);padding:4px;border-radius:20px;line-height:1.1}
.box.open{border-style:solid;font-size:clamp(18px,4vw,30px)}
.box.gold{background:var(--gold);color:#2A1418}
.box.zonk{background:var(--sky);color:#fff;border-color:var(--sky)}
</style>
</head>
<body>
<div class="band"></div>
<main id="app"></main>
<script>
const ICON={
lapet:()=>`<rect x="5" y="13" width="38" height="23" rx="6" fill="#5A9E45"/><path d="M5 24.5h38" stroke="#3E7A2F" stroke-width="2"/><rect x="20.5" y="11" width="7" height="27" rx="2.5" fill="#E8D7A8"/>`,
goyang:()=>{let p='';for(let i=0;i<8;i++){const a=i*Math.PI/4;p+=`<circle cx="${(24+13*Math.cos(a)).toFixed(1)}" cy="${(24+13*Math.sin(a)).toFixed(1)}" r="7" fill="#E3A52D"/>`}return p+`<circle cx="24" cy="24" r="9" fill="#F0BE55"/><circle cx="24" cy="24" r="3.5" fill="#B9741A"/>`},
dodol:()=>`<rect x="6" y="15" width="36" height="20" rx="5" fill="#4A2A1A"/><rect x="11" y="19" width="15" height="3.5" rx="1.7" fill="#8a5a3e"/><rect x="11" y="26" width="9" height="3" rx="1.5" fill="#6b4029"/>`,
bika:()=>{let d='';for(let r=0;r<2;r++)for(let c=0;c<5;c++)d+=`<circle cx="${12+c*6}" cy="${19+r*7}" r="2.4" fill="#C9951A"/>`;return `<rect x="5" y="12" width="38" height="24" rx="5" fill="#F2C230"/><rect x="5" y="31" width="38" height="5" rx="2.5" fill="#B5782A"/>`+d},
loyang:()=>{let h='';for(let i=0;i<6;i++){const a=i*Math.PI/3;h+=`<circle cx="${(24+10*Math.cos(a)).toFixed(1)}" cy="${(24+10*Math.sin(a)).toFixed(1)}" r="3.6" fill="#FFF3D6"/>`}return `<circle cx="24" cy="24" r="20" fill="#D99A32" stroke="#B9741A" stroke-width="2"/>`+h+`<circle cx="24" cy="24" r="4" fill="#FFF3D6"/>`}
};
const ico=f=>`<svg viewBox="0 0 48 48" aria-hidden="true">${ICON[f]()}</svg>`;
const L=[
{t:"Pola Gambar Bertambah",rows:[{f:"lapet",s:[2,4,6]}],ask:1,q:"Berapa jumlah lapet pada urutan berikutnya?",o:[7,8,9,10],a:8,e:"Jumlah lapet bertambah 2 pada setiap urutan: 2, 4, 6. Jadi urutan berikutnya 6 + 2 = 8. Ini pola membesar."},
{t:"Pola Gambar Berkurang",rows:[{f:"dodol",s:[10,8,6]}],ask:1,q:"Berapa jumlah dodol pada urutan berikutnya?",o:[2,3,4,5],a:4,e:"Jumlah dodol berkurang 2 pada setiap urutan: 10, 8, 6. Jadi urutan berikutnya 6 − 2 = 4. Ini pola mengecil."},
{t:"Pola Gambar Bertambah",rows:[{f:"bika",s:[3,6,9]}],ask:1,q:"Berapa jumlah bika ambon pada urutan berikutnya?",o:[10,11,12,13],a:12,e:"Jumlah bika ambon bertambah 3 pada setiap urutan: 3, 6, 9. Jadi urutan berikutnya 9 + 3 = 12. Ini pola membesar."},
{t:"Pola Gambar Berkurang",rows:[{f:"goyang",s:[16,13,10,7]}],ask:1,q:"Berapa jumlah kue kembang goyang pada urutan berikutnya?",o:[3,4,5,6],a:4,e:"Jumlah kue berkurang 3 pada setiap urutan: 16, 13, 10, 7. Jadi urutan berikutnya 7 − 3 = 4. Ini pola mengecil."},
{t:"Tantangan Pola Gambar",rows:[{n:"Lapet (bertambah)",f:"lapet",s:[2,4,6,8]},{n:"Kembang loyang (berkurang)",f:"loyang",s:[14,12,10,8]}],ask:0,q:"Pada urutan ke berapakah jumlah kedua gambar tersebut sama?",o:[2,3,4,5],a:4,e:"Lapet bertambah 2: 2, 4, 6, 8. Kembang loyang berkurang 2: 14, 12, 10, 8. Pada urutan ke-4, keduanya sama-sama berjumlah 8."}
];
const $=s=>document.querySelector(s),app=$('#app');
let S={sound:true,i:0};
/* suara */
let ac=null;
function tone(seq,vol){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(vol||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.9})}catch(e){}}
function say(){}
const sfx={ok(){tone([[523,.12],[659,.12],[784,.12],[1047,.3]]);say("Hebat! Jawabanmu benar!")},no(){tone([[260,.25],[220,.45]],.5);say("Yah, belum tepat! Giliran kelompok berikutnya!")},bonus(){tone([[784,.1],[988,.1],[1319,.35]])},zonk(){tone([[392,.22],[370,.22],[349,.22],[311,.55]])}};
const snd=()=>`<button class="ghost" id="sn">Suara: ${S.sound?"nyala":"mati"}</button>`;
const bindSn=()=>{const b=$('#sn');if(b)b.onclick=()=>{S.sound=!S.sound;b.textContent="Suara: "+(S.sound?"nyala":"mati")}};
/* soal acak untuk kelompok berikutnya */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),FD=["lapet","goyang","dodol","bika","loyang"],NM={lapet:"lapet",goyang:"kue kembang goyang",dodol:"dodol",bika:"bika ambon",loyang:"kembang loyang"};
function opts(a,d){const s=new Set([a]);[a-1,a+1,a+d,a-d,a+2].forEach(v=>{if(v>0&&s.size<4)s.add(v)});let k=3;while(s.size<4)s.add(a+k++);return [...s].sort((x,y)=>x-y)}
function gen(l){
 if(l===4){const d=R(1,2),x=R(1,4),k=R(3,4),y=x+2*(k-1)*d;
  const A=[0,1,2,3,4].map(i=>x+i*d),B=[0,1,2,3,4].map(i=>y-i*d);
  return {t:L[4].t,rows:[{n:"Lapet (bertambah)",f:"lapet",s:A},{n:"Kembang loyang (berkurang)",f:"loyang",s:B}],ask:0,q:L[4].q,o:[2,3,4,5],a:k,e:`Lapet bertambah ${d}: ${A.join(", ")}. Kembang loyang berkurang ${d}: ${B.join(", ")}. Pada urutan ke-${k}, keduanya sama-sama berjumlah ${x+(k-1)*d}.`}}
 const grow=l%2===0,n=l<2?3:4,f=FD[R(0,4)];let d,a,seq;
 do{d=grow?R(2,4):R(2,3);if(grow){const s0=R(1,6);seq=Array.from({length:n},(_,i)=>s0+i*d);a=s0+n*d}else{a=R(1,4);const st=a+n*d;seq=Array.from({length:n},(_,i)=>st-i*d)}}while(Math.max(...seq)>16);
 const last=seq[n-1];
 return {t:L[l].t,rows:[{f,s:seq}],ask:1,q:`Berapa jumlah ${NM[f]} pada urutan berikutnya?`,o:opts(a,d),a,e:`Jumlah ${NM[f]} ${grow?"bertambah":"berkurang"} ${d} pada setiap urutan: ${seq.join(", ")}. Jadi urutan berikutnya ${last} ${grow?"+":"−"} ${d} = ${a}. Ini pola ${grow?"membesar":"mengecil"}.`}}
/* layar */
function home(){
 app.innerHTML=`<div class="food">${["lapet","goyang","dodol","bika","loyang"].map(ico).join("")}</div>
 <h1>PETUALANGAN POLA GAMBAR</h1><p class="sub"><i>Ayo Temukan Polanya dan Raih Hadiahnya!</i></p>
 <div class="center"><button id="go" style="font-size:36px;padding:18px 40px">MULAI BERMAIN</button></div><div class="center">${snd()}</div>`;
 bindSn();$('#go').onclick=()=>{tone([[440,.08]]);try{speechSynthesis.getVoices()}catch(e){}rules()};
}
function rules(){
 app.innerHTML=`<h2 style="text-align:center;margin:10px 0 14px">Petunjuk Permainan</h2><div class="card"><ol class="rules">
 <li>Setiap kelompok mendapat giliran menjawab secara bergantian.</li><li>Amati gambar dan jumlah benda pada setiap urutan, lalu temukan aturan polanya.</li>
 <li>Pilih jawaban yang tepat. Jawaban benar mendapat 10 poin dan boleh memilih 1 dari 3 kotak kejutan.</li>
 <li>Hati-hati! Kotak BONUS dan ZONK muncul secara acak.</li><li>Kalau jawabanmu belum tepat, giliran pindah ke kelompok berikutnya.</li><li>Kumpulkan poin sebanyak-banyaknya sampai permainan selesai.</li></ol></div>
 <div class="center"><button id="st">AYO MULAI!</button></div>`;
 $('#st').onclick=setup;
}
function setup(){
 const opt=(a,d)=>a.map(i=>`<option ${i==d?'selected':''}>${i}</option>`).join('');
 app.innerHTML=`<h2 style="text-align:center;margin:10px 0 14px">Atur Kelompok</h2><div class="card">
 <div class="two"><div><label for="n">Jumlah kelompok</label><select id="n">${opt([2,3,4,5,6],4)}</select></div>
 <div><label for="lv">Jumlah level</label><select id="lv">${opt([3,4,5],5)}</select></div></div>
 <label>Nama kelompok</label><div class="names" id="nm"></div>
 </div>
 <div class="center"><button id="go2">MULAI PETUALANGAN</button></div>`;
 const draw=()=>{const n=+$('#n').value,old=[...document.querySelectorAll('#nm input')].map(i=>i.value);
  $('#nm').innerHTML=Array.from({length:n},(_,i)=>`<input aria-label="Nama kelompok ${i+1}" value="${old[i]||'Kelompok '+(i+1)}" maxlength="18">`).join('')};
 draw();$('#n').onchange=draw;
 $('#go2').onclick=()=>{S.g=[...document.querySelectorAll('#nm input')].map((i,k)=>({name:i.value.trim()||'Kelompok '+(k+1),score:0}));
  S.n=S.g.length;S.lv=+$('#lv').value;S.total=S.n*S.lv;S.turn=0;play()};
}
const pic=q=>q.rows.map(r=>{
 let h=r.n?`<div class="rowt">${r.n}</div>`:'';
 h+='<div class="seq" role="img" aria-label="Susunan makanan tradisional">';
 r.s.forEach((n,i)=>{h+=`<div class="grp"><small>Urutan ${i+1}</small><div class="ic">${ico(r.f).repeat(n)}</div></div>`});
 if(q.ask)h+=`<div class="grp"><small>Urutan ${r.s.length+1}</small><div class="qm">?</div></div>`;
 return h+'</div>'}).join('');
const chips=()=>S.g.map((g,i)=>`<div class="chip ${i==S.cur?'on':''}">${g.name}<b>${g.score}</b></div>`).join('');
const upd=()=>{const e=$('#bd');if(e)e.innerHTML=chips()};
function play(){
 const lvl=Math.floor(S.turn/S.n);S.cur=S.turn%S.n;S.tries=0;
 const q=S.cur===0?L[lvl]:gen(lvl);
 app.innerHTML=`<div class="score" id="bd">${chips()}</div>
 <div class="bar"><span class="pill">Level <b>${lvl+1}</b> dari ${S.lv}</span><span class="pill">Giliran: <b>${S.g[S.cur].name}</b></span>${snd()}</div>
 <div class="prog">${Array.from({length:S.lv},(_,k)=>`<i class="${k<lvl?'d':k==lvl?'c':''}"></i>`).join('')}</div>
 <div class="card"><div class="q">${q.q}</div>${pic(q)}
 <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-v="${o}">${'ABCD'[k]}. ${o}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`;
 bindSn();document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
}
function pick(b,q){
 const fb=$('#fb'),g=S.g[S.cur];
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.v===q.a)x.classList.add('ok')});
 if(+b.dataset.v!==q.a){b.classList.add('no');sfx.no();
  fb.innerHTML=`<div class="msg no">YAH, BELUM TEPAT! GILIRAN KELOMPOK BERIKUTNYA!</div><div class="why"><b>Jawaban yang benar: ${q.a}.</b> ${q.e}</div><div class="center" id="nx"></div>`;cont();return}
 g.score+=10;upd();sfx.ok();
 fb.innerHTML=`<div class="msg ok">HEBAT! JAWABANMU BENAR! +10 poin<div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div></div><div class="why"><b>Aturan pola:</b> ${q.e}</div><p class="center">Pilih satu kotak kejutan untuk ${g.name}!</p><div class="boxes" id="bx"></div><div class="center" id="nx"></div>`;
 const pr=[{t:"BONUS 10 POIN",v:10,c:"gold",m:"SELAMAT! KAMU MENDAPATKAN BONUS 10 POIN!",s:"Selamat! Bonus sepuluh poin!"},{t:"BONUS ⭐ 5 POIN",v:5,c:"gold",m:"LUAR BIASA! KAMU MENDAPATKAN 5 POIN TAMBAHAN!",s:"Luar biasa! Lima poin tambahan!"},{t:"ZONK!",v:0,c:"zonk",m:"ZONK! WADUH, BELUM BERUNTUNG! TETAP SEMANGAT!",s:"Zonk! Tetap semangat!"}].sort(()=>Math.random()-.5);
 const bx=$('#bx');
 pr.forEach((p,i)=>{const k=document.createElement('button');k.className='box';k.textContent='🎁';k.setAttribute('aria-label','Kotak kejutan '+(i+1));
  k.onclick=()=>{bx.querySelectorAll('.box').forEach((x,j)=>{x.disabled=true;x.classList.add('open',pr[j].c);x.textContent=pr[j].t;if(j!==i)x.style.opacity=.5});
   g.score+=p.v;upd();p.v?sfx.bonus():sfx.zonk();say(p.s);
   $('#nx').innerHTML=`<div class="msg ${p.c}">${p.m}</div><div class="center" id="cb"></div>`;cont('#cb')};
  bx.appendChild(k)});
